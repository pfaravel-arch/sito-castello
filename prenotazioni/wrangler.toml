# Motore delle prenotazioni del Castello di Silvano Pietra APS (Cloudflare Workers).
# Si pubblica da solo con .github/workflows/prenotazioni.yml.
# __D1_ID__ viene sostituito dalla pubblicazione con l'identificativo reale del database.
name = "castello-prenotazioni"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Da qui il motore legge gli eventi prenotabili (data/eventi.json del sito)
SITO = "https://www.castellodisilvanopietra.com"
# Siti che possono usare il motore
ORIGINI = "https://www.castellodisilvanopietra.com,https://castellodisilvanopietra.com"
# Impronta SHA-256 del codice di accesso custodito (cifrato) nell'area riservata del sito:
# chi entra nell'area riservata e' gia' autenticato anche qui. L'impronta non permette di risalire al codice.
AREA_TOKEN_SHA256 = "df72319db82dc5023e90e3d0ee68d75658cabfdce9d502c0f2707904fc77c245"
# E-mail di conferma delle prenotazioni: inviate dalla Gmail del Castello (SMTP con password per le app,
# segreto SMTP_PASSWORD). In alternativa Brevo, se c'e' il segreto BREVO_API_KEY e non SMTP_PASSWORD.
SMTP_HOST = "smtp.gmail.com"
SMTP_PORTA = "465"
SMTP_UTENTE = "castellodisilvanopietra@gmail.com"
EMAIL_MITTENTE = "castellodisilvanopietra@gmail.com"
EMAIL_NOME = "Castello di Silvano Pietra APS"
EMAIL_RISPOSTA = "castellodisilvanopietra@gmail.com"
# Copia di ogni prenotazione all'associazione (lasciare vuoto per non riceverla)
EMAIL_COPIA = "castellodisilvanopietra@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "castello-prenotazioni"
database_id = "__D1_ID__"
migrations_dir = "migrations"
